```yaml
name: Build NetHunter for Galaxy Note 3 SM-N9005

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-requests python3-yaml

      - name: Download official NetHunter installer
        run: |
          git clone --depth 1 \
            https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-installer.git \
            kali-nethunter-installer

      - name: Inspect official build options
        working-directory: kali-nethunter-installer
        run: |
          set -e
          ls -la
          python3 build.py --help 2>&1 | tee build-help.txt

      - name: Build NetHunter Full
        working-directory: kali-nethunter-installer
        shell: bash
        run: |
          set -o pipefail
          python3 build.py -k hlte-eur-los --nougat --rootfs full \
            2>&1 | tee build.log

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-hlte-build-results
          path: |
            kali-nethunter-installer/*.zip
            kali-nethunter-installer/build.log
            kali-nethunter-installer/build-help.txt
          if-no-files-found: warn
          retention-days: 7
```
